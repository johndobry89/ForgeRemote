name: Validate
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version && xcodebuild -version
      - run: swift test --jobs 3
        working-directory: apps/mac
      - run: swift build -c release --jobs 3
        working-directory: apps/mac
